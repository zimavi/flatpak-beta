name: publish

# Builds what changed and uploads the signed repository to R2. Setup: see README.md.
on:
  push:
    branches: [ main ]
    paths: [ "apps/**", "scripts/**", zimavi.flatpakrepo, .github/workflows/publish.yml ]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a running one is never cut off in the middle of an upload.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: publish
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # The image has no package manager.
      - name: Install rclone
        env:
          VERSION: v1.76.0
          SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          zip=rclone-$VERSION-linux-amd64.zip
          curl -fsSL -o "/tmp/$zip" "https://downloads.rclone.org/$VERSION/$zip"
          echo "$SHA256  /tmp/$zip" | sha256sum -c
          unzip -q -j "/tmp/$zip" '*/rclone' -d /usr/bin

      - name: Publish
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          BUCKET: ${{ vars.R2_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true" # the token may only touch objects
        run: |
          [[ $GPG_PRIVATE_KEY ]] || { echo "::error::The GPG_PRIVATE_KEY secret is missing"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          bash scripts/publish.sh "r2:$BUCKET" "$key"
        shell: bash
